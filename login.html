<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<title>Вход</title>


<style>

body{

    margin:0;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#111;

    font-family:Arial,sans-serif;

}



.form{

    display:flex;

    flex-direction:column;

    gap:15px;

    padding:30px;

    width:330px;

    background:#171717;

    border-radius:25px;

    box-shadow:0 0 20px #000;

}



#heading{

    text-align:center;

    color:white;

    font-size:25px;

    margin-bottom:20px;

}



.field{

    display:flex;

    align-items:center;

    gap:10px;

    padding:12px;

    border-radius:25px;

    background:#0f0f0f;

    box-shadow:inset 2px 5px 10px #000;

}



.input-icon{

    width:20px;

    height:20px;

    fill:white;

}



.input-field{

    width:100%;

    background:none;

    border:none;

    outline:none;

    color:white;

    font-size:15px;

}



.btn{

    display:flex;

    justify-content:center;

    gap:10px;

    margin-top:15px;

}



.button1,
.button2{

    padding:10px 25px;

    border:none;

    border-radius:8px;

    background:#252525;

    color:white;

    cursor:pointer;

    transition:.3s;

}



.button1:hover{

    background:#1976d2;

}



.button2:hover{

    background:#2e7d32;

}



.button3{

    padding:10px;

    border:none;

    border-radius:8px;

    background:#252525;

    color:white;

    cursor:pointer;

}



.button3:hover{

    background:#d32f2f;

}



a{

    text-decoration:none;

}


.error{

    color:#ff5252;

    text-align:center;

}



</style>


</head>



<body>



<form class="form" method="POST">


<p id="heading">

Вход

</p>



{% if error %}

<p class="error">

{{error}}

</p>

{% endif %}




<div class="field">


<svg class="input-icon" viewBox="0 0 16 16">

<path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>

</svg>



<input

autocomplete="off"

placeholder="Имя пользователя"

class="input-field"

type="text"

name="username"

required>


</div>






<div class="field">


<svg class="input-icon" viewBox="0 0 16 16">

<path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2z"/>

</svg>



<input

placeholder="Пароль"

class="input-field"

type="password"

name="password"

required>


</div>






<div class="btn">


<button class="button1" type="submit">

Войти

</button>




<a href="/register">

<button class="button2" type="button">

Регистрация

</button>

</a>



</div>





<button class="button3" type="button">

Забыли пароль?

</button>



</form>




</body>

</html>
